[tool.poetry]
name = "drones_comms_model"
version = "0.1.0"       
description = "Pydantic message contracts for gimbal commands and drone acknowledgements"
authors = []
readme = "README.md"
package-mode = true
packages = [{ include = "drones_comms_model" }]

# This section holds the project's dependencies
[tool.poetry.dependencies]
python = ">=3.12"
pydantic = ">=2.11.5,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"